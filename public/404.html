<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Страница не найдена — Clean House</title>
    <style>
      :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17211b; background: #f5faf7; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 560px; padding: 48px; text-align: center; background: #fff; border: 1px solid #dce8df; border-radius: 24px; box-shadow: 0 20px 50px rgba(16, 80, 43, .08); }
      strong { display: block; color: #22a657; font-size: 72px; line-height: 1; }
      h1 { margin: 16px 0 12px; font-size: 32px; }
      p { margin: 0 0 28px; color: #5d6b62; line-height: 1.6; }
      a { display: inline-block; padding: 12px 20px; color: #fff; background: #22a657; border-radius: 10px; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <strong>404</strong>
      <h1>Страница не найдена</h1>
      <p>Возможно, адрес изменился или страница была удалена.</p>
      <a href="/">Вернуться на главную</a>
    </main>
  </body>
</html>
